ageism|noun|1:
  definition_full: Prejudice or discrimination aimed at people based on how old they
    are, particularly affecting older adults in work or daily life.
  definition_short: Bad treatment of people because they are old.
  example: The charity campaign aims to combat workplace ageism through education.
  synonyms:
  - discrimination
  - bias
  - prejudice
bilingualism|noun|1:
  definition_full: The condition of regularly using two different languages to speak
    or write.
  definition_short: The ability to speak two different languages.
  example: Early childhood education often encourages bilingualism to help students
    cognitive development.
  synonyms:
  - fluency
  - multilingualism
candidacy|noun|1:
  definition_full: The period during which someone seeks election or appointment to
    a political office or official role.
  definition_short: The state of standing for election to a position.
  example: Her unexpected candidacy for mayor energised young voters across the entire
    city.
  synonyms:
  - campaigning
  - nomination
candidature|noun|1:
  definition_full: The campaign and process of standing for election or appointment
    to an official role.
  definition_short: The process of standing for an election or office.
  example: He withdrew his candidature after party leaders chose another representative.
  synonyms:
  - nomination
  - campaigning
captaincy|noun|1:
  definition_full: The status, authority, or period of being in charge of a sports
    team or ship.
  definition_short: The position or duties of a team leader.
  example: She celebrated her promotion to captaincy after leading the team to victory.
  synonyms:
  - leadership
  - command
  - stewardship
chancellery|noun|1:
  definition_full: The office, main building, or staff quarters of an embassy or senior
    government minister.
  definition_short: The official building where a foreign minister works.
  example: Diplomatic documents were officially dispatched from the grand chancellery
    this morning.
  synonyms:
  - headquarters
  - embassy
  - bureau
chaplaincy|noun|1:
  definition_full: The department or role providing spiritual care and guidance in
    a hospital, school, or military body.
  definition_short: The office that gives church care in a hospital or school.
  example: He applied for the university chaplaincy to support students requiring
    pastoral care.
  synonyms:
  - ministry
  - pastoral care
cottager|noun|1:
  definition_full: Someone who resides in a small country home, traditionally working
    on nearby land.
  definition_short: A person who lives in a small rural home.
  example: The old cottager tended his vegetable garden every single morning.
  synonyms:
  - dweller
  - resident
  - tenant
  - villager
courtier|noun|1:
  definition_full: A companion or adviser who attends on a sovereign or royal family.
  definition_short: An officer who serves in a royal household.
  example: The ambitious courtier whispered warnings to the king about the visiting
    ambassador.
  synonyms:
  - attendant
  - retainer
  - aide
cubism|noun|1:
  definition_full: A style of painting and sculpture where subjects are broken down
    into geometric shapes and depicted from multiple viewpoints simultaneously.
  definition_short: An art movement using flat shapes to show subjects.
  example: Pablo Picasso and Georges Braque pioneered cubism in Paris during the early
    years of the century.
  synonyms:
  - modern art
  - avant-garde
directorate|noun|1:
  definition_full: An administrative body of senior officials chosen to govern a company
    or government agency.
  definition_short: A committee or board that manages an organisation.
  example: The corporate directorate approved the new merger plans late last night.
  synonyms:
  - board
  - management
  - administration
doubly|adv|1:
  definition_full: Happening with two times the normal amount, intensity, or care.
  definition_short: To twice the degree.
  example: He was doubly careful when walking on the icy path this morning.
  synonyms:
  - twice
  - increasingly
  - especially
dualism|noun|1:
  definition_full: The philosophical idea that things are divided into two opposing
    principles, such as mind and matter, or good and evil.
  definition_short: The belief that everything has two opposite parts.
  example: Eastern philosophy often explores the dualism between light and dark energies.
  synonyms:
  - division
  - dichotomy
  - polarity
falconry|noun|1:
  definition_full: The traditional sport or practice of hunting wild quarry using
    trained hawks and birds of prey.
  definition_short: The sport of hunting with trained birds.
  example: Medieval nobles considered falconry to be an elite recreational pastime.
  synonyms:
  - hawking
  - hunting
futurist|noun|1:
  definition_full: A person who studies modern trends and technologies to anticipate
    coming developments in society.
  definition_short: Someone who tries to tell what will happen next.
  example: The keynote speaker was a leading futurist discussing artificial intelligence
    in medicine.
  synonyms:
  - forecaster
  - visionary
  - analyst
hotelier|noun|1:
  definition_full: The owner or manager of an establishment that provides lodging,
    meals, and other services for travelers.
  definition_short: A person who owns or runs a place for guests to stay.
  example: The experienced hotelier renovated the seaside property into a luxury boutique
    resort.
  synonyms:
  - innkeeper
  - proprietor
  - manager
humanism|noun|1:
  definition_full: A worldview or belief system that values practical reason, scientific
    inquiry, and individual dignity over spiritual dogma.
  definition_short: A belief system based on reason rather than religion.
  example: Renaissance humanism sparked a revival of classical learning across Europe.
  synonyms:
  - secularism
  - rationalism
  - philosophy
idealist|noun|2:
  definition_full: Someone who envisions how the world should be and pursues noble
    standards rather than compromises.
  definition_short: A person who follows high standards rather than easy choices.
  example: Critics dismissed him as a youthful idealist who underestimated political
    realities.
  synonyms:
  - dreamer
  - visionary
  - romantic
knacker|noun|1:
  definition_full: A person who buys old horses for slaughter, or someone who takes
    apart old vehicles and ships for scrap.
  definition_short: Someone who buys old horses or broken goods for scrap.
  example: The injured farm animal was sold to the knacker for meat processing.
  synonyms:
  - slaughterer
  - scrapper
leftist|adj|1:
  definition_full: Relating to political views that promote social equality, public
    ownership, and progressive change.
  definition_short: Holding political views that support public control and social
    change.
  example: Several student groups formed a leftist coalition to protest university
    tuition increases.
  synonyms:
  - socialist
  - progressive
  - radical
lineage|noun|1:
  definition_full: The series of ancestors from whom a person, family, or species
    is descended.
  definition_short: A family tree that goes back to early relatives.
  example: The family proudly traced its unbroken royal lineage back over four centuries.
  synonyms:
  - ancestry
  - descent
  - pedigree
  - heritage
manhood|noun|1:
  definition_full: The condition or period of life of being an adult male, or qualities
    traditionally associated with that stage.
  definition_short: The state of being a fully grown adult male.
  example: In many cultures ancient ceremonies marked a boy transition into full manhood.
  synonyms:
  - maturity
  - adulthood
naturalist|noun|2:
  definition_full: A biologist who studies living organisms, their habits, and their
    outdoor habitats through observation.
  definition_short: A person who looks at wild plants and animals.
  example: Charles Darwin was a keen naturalist whose keen observations led to modern
    evolutionary theory.
  synonyms:
  - biologist
  - zoologist
  - botanist
palatine|adj|1:
  definition_full: Historically describing an official or territory possessing royal
    privileges and sovereign authority within a kingdom.
  definition_short: Relating to royal power or high authority in a kingdom.
  example: The count held palatine jurisdiction allowing him to govern without imperial
    interference.
  synonyms:
  - royal
  - sovereign
  - imperial
parentage|noun|1:
  definition_full: The identity or origins of someone mother and father, or the ancestral
    heritage from which they descend.
  definition_short: The identity of someone mother and father.
  example: Questions arose regarding the royal baby true parentage during the disputed
    succession.
  synonyms:
  - ancestry
  - origin
  - lineage
  - descent
personage|noun|1:
  definition_full: A prominent figure of high social standing, or a notable character
    in a literary work.
  definition_short: An important, famous, or well-known individual.
  example: The foreign dignitary was treated as a distinguished personage throughout
    his state visit.
  synonyms:
  - dignitary
  - notable
  - celebrity
  - figure
predation|noun|1:
  definition_full: The biological interaction in which one creature captures, kills,
    and feeds on another animal.
  definition_short: The hunting and killing of one animal by another.
  example: The small lizards developed clever hiding spots to escape the constant
    threat of predation.
  synonyms:
  - hunting
  - carnivory
saddler|noun|1:
  definition_full: A skilled craftsperson who works with leather to design, make,
    and mend equipment for riding horses.
  definition_short: Someone who makes and repairs riding equipment for horses.
  example: The village saddler mended the worn leather straps for the farm horses.
  synonyms:
  - leatherworker
  - harnessmaker
scrounger|noun|1:
  definition_full: A person who habitually borrows or begs goods and money from others
    instead of working for them.
  definition_short: Someone who tries to get items or money for free.
  example: He was known around the neighbourhood as a lazy scrounger who never bought
    his own drinks.
  synonyms:
  - cadger
  - freeloader
  - parasite
scrummage|noun|1:
  definition_full: A set formation in rugby union where players from opposing teams
    interlock and push to gain possession of the ball.
  definition_short: A rugby contest where players push for the ball.
  example: The referee blew his whistle to reset the messy scrummage near the try
    line.
  synonyms:
  - contest
  - struggle
  - restart
separable|adj|1:
  definition_full: Capable of being divided into individual components without damaging
    the whole.
  definition_short: Able to be pulled apart into different pieces.
  example: The components of the device are completely separable for easy cleaning
    and maintenance.
  synonyms:
  - divisible
  - detachable
  - severable
  - distinct
sexism|noun|1:
  definition_full: Prejudice, stereotyping, or discrimination against people on the
    basis of gender, especially against women.
  definition_short: Bad treatment of someone because they are a man or woman.
  example: The organisation launched a campaign to tackle workplace sexism and ensure
    equal pay.
  synonyms:
  - prejudice
  - bias
  - discrimination
statehood|noun|1:
  definition_full: The constitutional condition or status of an organised territory
    having self-governing authority within a federal nation.
  definition_short: The legal status of being an independent region or nation.
  example: The territory campaigned for years before achieving official statehood.
  synonyms:
  - independence
  - sovereignty
  - autonomy
summation|noun|1:
  definition_full: A final recapitulation of arguments delivered at the close of an
    address or trial, or the mathematical process of adding quantities.
  definition_short: A final review of points or total count of numbers.
  example: The lawyer gave a brilliant summation at the end of the trial.
  synonyms:
  - conclusion
  - review
  - total
transcription|noun|1:
  definition_full: The process of converting speech or recorded language into written
    text, or an arrangement of a musical piece for different instruments.
  definition_short: The process of converting spoken words into written text.
  example: The secretary prepared a written transcription of the recorded meeting.
  synonyms:
  - recording
  - arrangement
  - copy
  - reproduction
truism|noun|1:
  definition_full: A claim or proposition that is so evident or self-explanatory that
    discussing it provides little new information.
  definition_short: A statement that is obvious to everyone.
  example: It is an economic truism that supply and demand dictate market prices.
  synonyms:
  - axiom
  - platitude
  - commonplace
unionism|noun|1:
  definition_full: The principles or policy of forming labour federations to protect
    workers rights, or political loyalty to a unified governing kingdom.
  definition_short: Support for workers associations or a single country.
  example: Trade unionism played a major role in improving factory safety standards.
  synonyms:
  - solidarity
  - coalition
  - alliance
unitary|adj|1:
  definition_full: Characterized by undivided structure or government, in which constitutional
    authority is held entirely by a central governing body.
  definition_short: Formed as a single whole with power in one place.
  example: The nation operates under a unitary system of rule.
  synonyms:
  - central
  - single
  - unified
  - monolithic
