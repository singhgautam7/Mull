# Phrases curation: aphorisms, borrowed phrases, and category overrides.
#
# Schema requirements:
# - type: idiom | proverb | simile | phrasal_verb | binomial | aphorism
# - usage_note: mandatory for proverb, simile, aphorism; optional for others
# - attribution: mandatory for aphorism; null for folklore / anonymous
# - source_language: non-null for borrowed phrases ('fr', 'la', 'de', 'it', 'es', 'el')
# - register: everyday | formal | literary | informal | slang | archaic | pretentious

aphorisms:
  - phrase: "The unexamined life is not worth living"
    attribution: "Socrates (in Plato's Apology)"
    meaning: "A life lived without critical reflection and self-awareness lacks true human value."
    usage_note: "Philosophical maxim urging intellectual honesty and self-examination."
    register: "literary"
    example: "He abandoned corporate finance to study philosophy, citing Socrates's belief that the unexamined life is not worth living."

  - phrase: "Knowledge is power"
    attribution: "Francis Bacon (Meditationes Sacrae, 1597)"
    meaning: "Possessing knowledge and information gives one the ability to act effectively and control outcomes."
    usage_note: "Widely cited principle emphasizing the practical and strategic value of education."
    register: "everyday"
    example: "In regulatory negotiation, thorough knowledge of the statute is power."

  - phrase: "Man is born free, and everywhere he is in chains"
    attribution: "Jean-Jacques Rousseau (The Social Contract, 1762)"
    meaning: "Human beings have natural liberty at birth but become constrained by oppressive social and political systems."
    usage_note: "Political adage opening discussions of political liberty and social obligation."
    register: "literary"
    example: "Rousseau's declaration that man is born free but everywhere in chains galvanized revolutionary thought."

  - phrase: "I think, therefore I am"
    attribution: "René Descartes (Discourse on the Method, 1637)"
    meaning: "One's own existence is proved by the undeniable reality of one's conscious doubt and thought."
    usage_note: "Foundational philosophical assertion; best used in discussions of consciousness or epistemology."
    source_language: "la"
    register: "literary"
    example: "Descartes began his entire system of epistemology with the single indisputable truth: I think, therefore I am."

  - phrase: "The only thing I know is that I know nothing"
    attribution: "Socrates (via Plato)"
    meaning: "True wisdom begins with the humble admission of one's own ignorance."
    usage_note: "Used to counter intellectual arrogance or commend intellectual modesty."
    register: "literary"
    example: "The elder professor smiled and conceded that, like Socrates, the only thing he knew for certain was that he knew nothing."

  - phrase: "Power tends to corrupt, and absolute power corrupts absolutely"
    attribution: "Lord Acton (Letter to Bishop Mandell Creighton, 1887)"
    meaning: "The possession of power inevitably degrades a person's moral compass, and unchecked authority causes complete corruption."
    usage_note: "Universal warning in political commentary against unchecked executive authority."
    register: "formal"
    example: "The dictator's trajectory was a textbook demonstration that power tends to corrupt, and absolute power corrupts absolutely."

  - phrase: "Hell is other people"
    attribution: "Jean-Paul Sartre (No Exit, 1944)"
    meaning: "The painful consciousness of being judged and defined by the gaze of others is our deepest torment."
    usage_note: "Frequently misconstrued as general misanthropy; correctly used regarding social judgment."
    register: "literary"
    example: "After three hours trapped in the boardroom with his rival directors, he muttered Sartre's line that hell is other people."

  - phrase: "Those who cannot remember the past are condemned to repeat it"
    attribution: "George Santayana (The Life of Reason, 1905)"
    meaning: "Failing to learn from historical errors ensures that identical failures will recur."
    usage_note: "Standard rhetorical warning when political or economic mistakes are renewed."
    register: "formal"
    example: "Ignoring the currency collapse of the 1970s proved once again that those who cannot remember the past are condemned to repeat it."

  - phrase: "All animals are equal, but some animals are more equal than others"
    attribution: "George Orwell (Animal Farm, 1945)"
    meaning: "A cynical proclamation of false equality masking hypocrisy and elite privilege."
    usage_note: "Satirical indictment of corrupt egalitarian regimes or corporate double standards."
    register: "literary"
    example: "The executive bonus scheme made it plain that all employees were equal, but some were more equal than others."

  - phrase: "Big Brother is watching you"
    attribution: "George Orwell (Nineteen Eighty-Four, 1949)"
    meaning: "Totalitarian state surveillance monitors every private action and thought."
    usage_note: "Invoked against government surveillance, intrusive technology, or managerial overreach."
    register: "everyday"
    example: "With cameras on every lamppost and keystroke loggers on our laptops, Big Brother is truly watching us."

  - phrase: "The mass of men lead lives of quiet desperation"
    attribution: "Henry David Thoreau (Walden, 1854)"
    meaning: "Most people endure unfulfilling, routine existences silently hiding their unhappiness."
    usage_note: "Reflective observation on modern conformity and economic entrapment."
    register: "literary"
    example: "Looking across the morning commuter train, she recalled Thoreau's diagnosis that the mass of men lead lives of quiet desperation."

  - phrase: "Whatever does not kill me makes me stronger"
    attribution: "Friedrich Nietzsche (Twilight of the Idols, 1889)"
    meaning: "Enduring and surviving severe adversity strengthens character, fortitude, and resilience."
    usage_note: "Motto of stoic endurance; often paraphrased casually."
    register: "everyday"
    example: "She treated the loss of her first startup as a harsh education, believing that whatever does not kill you makes you stronger."

  - phrase: "There is nothing either good or bad, but thinking makes it so"
    attribution: "William Shakespeare (Hamlet, Act II, Scene 2)"
    meaning: "Moral quality and emotional distress arise from human perception rather than external reality."
    usage_note: "Stoic sentiment applied to maintain composure under misfortune."
    register: "literary"
    example: "Hamlet's reminder that there is nothing either good or bad but thinking makes it so helped her accept the delay."

  - phrase: "Brevity is the soul of wit"
    attribution: "William Shakespeare (Hamlet, Act II, Scene 2)"
    meaning: "Speech and writing are far more effective, intelligent, and humorous when concise."
    usage_note: "Admonition against verbosity, ironically spoken by the windy Polonius."
    register: "formal"
    example: "The judge cut the barrister off with the dry reminder that brevity is the soul of wit."

  - phrase: "A little learning is a dangerous thing"
    attribution: "Alexander Pope (An Essay on Criticism, 1711)"
    meaning: "Superficial knowledge makes a person overconfident and prone to reckless mistakes."
    usage_note: "Caution against assuming expertise after shallow study; often misquoted as 'a little knowledge'."
    register: "formal"
    example: "Armed with a five-minute internet search, he attempted to rewire the fusebox, proving that a little learning is a dangerous thing."

  - phrase: "To err is human; to forgive, divine"
    attribution: "Alexander Pope (An Essay on Criticism, 1711)"
    meaning: "Making mistakes is natural to mortals, but showing unconditional mercy reflects godlike virtue."
    usage_note: "Used to counsel leniency and reconciliation after an error."
    register: "everyday"
    example: "She accepted his clumsy apology graciously, acknowledging that to err is human, to forgive divine."

  - phrase: "Fools rush in where angels fear to tread"
    attribution: "Alexander Pope (An Essay on Criticism, 1711)"
    meaning: "Inexperienced or reckless people plunge into perilous situations that prudent people avoid."
    usage_note: "Warning against impulsive intervention in delicate or dangerous matters."
    register: "everyday"
    example: "Novice traders bought the falling stock eagerly, forgetting that fools rush in where angels fear to tread."

  - phrase: "Hope springs eternal in the human breast"
    attribution: "Alexander Pope (An Essay on Man, 1733)"
    meaning: "People persistently anticipate future happiness or improvement, however bleak their circumstances."
    usage_note: "Commentary on human optimism despite repeated disappointments."
    register: "everyday"
    example: "Though the club had not won a title in forty years, hope springs eternal in the supporters' breasts."

  - phrase: "No man is an island"
    attribution: "John Donne (Devotions upon Emergent Occasions, 1624)"
    meaning: "No individual is self-sufficient; all humans are deeply connected to and reliant on community."
    usage_note: "Moral reminder of human interdependence and empathy in times of grief or crisis."
    register: "everyday"
    example: "Donne's meditation that no man is an island reminds us that public health depends on civic solidarity."

  - phrase: "Never send to know for whom the bell tolls; it tolls for thee"
    attribution: "John Donne (Devotions upon Emergent Occasions, 1624)"
    meaning: "Any person's death diminishes humanity as a whole, because we are all bound together."
    usage_note: "Solemn reflection on universal mortality and solidarity."
    register: "literary"
    example: "Reading the obituary of a stranger in wartime, she felt Donne's truth: the bell tolls for thee."

  - phrase: "The child is father of the man"
    attribution: "William Wordsworth (My Heart Leaps Up, 1802)"
    meaning: "The experiences and natural instincts of childhood shape adult character and temperament."
    usage_note: "Reflective note on psychological development and formative early experiences."
    register: "literary"
    example: "His lifelong fascination with ornithology began in primary school; truly, the child is father of the man."

  - phrase: "Beauty is truth, truth beauty"
    attribution: "John Keats (Ode on a Grecian Urn, 1819)"
    meaning: "True artistic excellence and fundamental aesthetic reality are indivisible."
    usage_note: "Aesthetic maxim celebrating the enduring permanence of art over mortal suffering."
    register: "literary"
    example: "Keats concluded his masterpiece with the enigmatic consolation that beauty is truth, truth beauty."

  - phrase: "The only way to get rid of a temptation is to yield to it"
    attribution: "Oscar Wilde (The Picture of Dorian Gray, 1890)"
    meaning: "Resisting desire consumes energy and obsesses the mind, whereas indulgence dispels the longing."
    usage_note: "Paradoxical hedonistic quip, delivered by Lord Henry Wotton."
    register: "literary"
    example: "He eyed the second slice of cake, murmuring Wilde's advice that the only way to get rid of temptation is to yield to it."

  - phrase: "We are all in the gutter, but some of us are looking at the stars"
    attribution: "Oscar Wilde (Lady Windermere's Fan, 1892)"
    meaning: "Despite the squalor and misery of earthly life, idealists remain inspired by noble aspirations."
    usage_note: "Poignant expression of hope and romantic idealism amidst degradation."
    register: "literary"
    example: "Bankrupt and exhausted, he refused despair: we are all in the gutter, but some of us are looking at the stars."

  - phrase: "I can resist everything except temptation"
    attribution: "Oscar Wilde (Lady Windermere's Fan, 1892)"
    meaning: "A humorous confession of total weakness when confronted with alluring pleasures."
    usage_note: "Self-deprecating wit when admitting moral frailty or giving in to indulgence."
    register: "everyday"
    example: "I intended to stick strictly to my budget, but like Wilde, I can resist everything except temptation."

  - phrase: "Experience is simply the name we give our mistakes"
    attribution: "Oscar Wilde (The Picture of Dorian Gray, 1890)"
    meaning: "What people call worldly wisdom is merely the accumulated memory of their past blunders."
    usage_note: "Consoling, wry appraisal of painful lessons learned the hard way."
    register: "everyday"
    example: "After the failed product launch, she comforted the team by noting that experience is simply the name we give our mistakes."

  - phrase: "A cynic is a man who knows the price of everything and the value of nothing"
    attribution: "Oscar Wilde (Lady Windermere's Fan, 1892)"
    meaning: "Cynics measure the world solely in terms of financial cost while blind to intrinsic worth."
    usage_note: "Classic rebuke to purely transactional or mercenary attitudes."
    register: "formal"
    example: "Slashing the library budget proved the treasurer was a cynic who knew the price of everything and the value of nothing."

  - phrase: "The truth is rarely pure and never simple"
    attribution: "Oscar Wilde (The Importance of Being Earnest, 1895)"
    meaning: "Reality is tangled, contradictory, and compromised rather than clean and obvious."
    usage_note: "Warning against naive, black-and-white interpretations of human conduct."
    register: "formal"
    example: "The investigative reporter warned her editor that the truth is rarely pure and never simple."

  - phrase: "The medium is the message"
    attribution: "Marshall McLuhan (Understanding Media, 1964)"
    meaning: "The form and channel of a communications medium shapes society far more than the content delivered."
    usage_note: "Core dictum of media theory and cultural analysis."
    register: "formal"
    example: "McLuhan's insight that the medium is the message became obvious with the rise of algorithmic social feeds."

  - phrase: "In the future, everyone will be world-famous for fifteen minutes"
    attribution: "Andy Warhol (Exhibition catalogue, Moderna Museet, 1968)"
    meaning: "Mass media and modern celebrity culture will grant fleeting, ephemeral notoriety to everyone."
    usage_note: "Prescient commentary on internet virality and temporary celebrity."
    register: "everyday"
    example: "Her viral cooking video gave her Warhol's promised fifteen minutes of fame."

  - phrase: "Not all those who wander are lost"
    attribution: "J. R. R. Tolkien (The Fellowship of the Ring, 1954)"
    meaning: "Exploration, contemplation, and aimless travel can be purposeful rather than directionless."
    usage_note: "Celebration of non-linear life journeys and contemplative exploration."
    register: "literary"
    example: "Taking a gap year to hike across Scandinavia proved that not all those who wander are lost."

  - phrase: "Two roads diverged in a wood, and I took the one less traveled by"
    attribution: "Robert Frost (The Road Not Taken, 1916)"
    meaning: "Choosing an unconventional life path has far-reaching and transformative personal consequences."
    usage_note: "Emblematic motto of individual choice and non-conformity."
    register: "literary"
    example: "Rejecting a safe career in accountancy to open an artisanal bakery was taking the road less traveled."

  - phrase: "The limits of my language mean the limits of my world"
    attribution: "Ludwig Wittgenstein (Tractatus Logico-Philosophicus, 1921)"
    meaning: "Our capacity to understand, describe, and experience reality is bounded by our vocabulary and concepts."
    usage_note: "Epistemological insight on language, cognition, and philosophy."
    register: "literary"
    example: "Learning precise technical vocabulary proved Wittgenstein's point that the limits of language mean the limits of one's world."

  - phrase: "Whereof one cannot speak, thereof one must be silent"
    attribution: "Ludwig Wittgenstein (Tractatus Logico-Philosophicus, 1921)"
    meaning: "One should remain silent regarding matters that lie beyond the bounds of clear and verifiable language."
    usage_note: "Philosophical reminder against speaking dogmatically on the ineffable."
    register: "literary"
    example: "When asked about metaphysics, the analytical philosopher echoed Wittgenstein: whereof one cannot speak, thereof one must be silent."

  - phrase: "Nothing is certain except death and taxes"
    attribution: "Benjamin Franklin (Letter to Jean-Baptiste Le Roy, 1789)"
    meaning: "Mortality and financial obligation to the state are the only unavoidable facts of human existence."
    usage_note: "Pragmatic, dry acceptance of inescapable burdens."
    register: "everyday"
    example: "You can appeal against your parking ticket, but remember that nothing is certain except death and taxes."

  - phrase: "Early to bed and early to rise makes a man healthy, wealthy, and wise"
    attribution: "Benjamin Franklin (Poor Richard's Almanack, 1735)"
    meaning: "A disciplined, temperate schedule yields physical vitality, financial success, and mental acuity."
    usage_note: "Traditional moralistic proverb promoting disciplined daily routine."
    register: "everyday"
    example: "His grandmother always lived by Franklin's maxim: early to bed and early to rise makes a man healthy, wealthy, and wise."

  - phrase: "Three may keep a secret, if two of them are dead"
    attribution: "Benjamin Franklin (Poor Richard's Almanack, 1735)"
    meaning: "Secrets shared with multiple living people are virtually guaranteed to leak."
    usage_note: "Wry caution against confiding confidential information to colleagues."
    register: "everyday"
    example: "Don't tell anyone in the office; remember that three may keep a secret if two of them are dead."

  - phrase: "Time is money"
    attribution: "Benjamin Franklin (Advice to a Young Tradesman, 1748)"
    meaning: "Time is a valuable commodity that can be converted into earnings; wasting time squanders wealth."
    usage_note: "Pivotal capitalist adage emphasizing productivity and punctual efficiency."
    register: "everyday"
    example: "Let's wrap up this meeting quickly; remember that time is money."

  - phrase: "The journey of a thousand miles begins with a single step"
    attribution: "Laozi (Daodejing, Chapter 64)"
    meaning: "Even the most intimidating and monumental undertakings must start with a humble initial action."
    usage_note: "Encouraging maxim to overcome paralysis and initiate daunting projects."
    register: "everyday"
    example: "Writing a doctoral thesis is terrifying, but the journey of a thousand miles begins with a single step."

  - phrase: "Know thyself"
    attribution: "Temple of Apollo at Delphi (Delphic maxim)"
    meaning: "The primary and most vital pursuit of life is understanding one's own character, limits, and desires."
    usage_note: "Ancient Greek philosophical imperative; counsel against hubris."
    register: "literary"
    example: "Before choosing a career path, take time to reflect on the ancient Delphic command: know thyself."

  - phrase: "Everything flows, nothing stands still"
    attribution: "Heraclitus (via Plato's Cratylus)"
    meaning: "The fundamental nature of the universe is constant, ceaseless change and flux."
    usage_note: "Metaphysical comfort or caution regarding the inevitability of change."
    register: "literary"
    example: "Industries come and go; Heraclitus was right that everything flows and nothing stands still."

  - phrase: "Man is the measure of all things"
    attribution: "Protagoras (quoted in Plato's Theaetetus)"
    meaning: "Individual human perception and experience determine the nature of truth and value."
    usage_note: "Foundational statement of relativism and humanist philosophy."
    register: "literary"
    example: "Protagoras's claim that man is the measure of all things shifted philosophy from cosmology to human ethics."

  - phrase: "Fortune favours the bold"
    attribution: "Virgil (Aeneid, Book X)"
    meaning: "People who take courageous, decisive risks achieve greater success than the timid."
    usage_note: "Rallying cry before taking a daring venture; Latin: Audentes fortuna iuvat."
    source_language: "la"
    register: "everyday"
    example: "He submitted the audacious pitch knowing that fortune favours the bold."

  - phrase: "The die is cast"
    attribution: "Julius Caesar (Suetonius, Divus Julius)"
    meaning: "An irrevocable decision has been made and an irreversible course of action entered upon."
    usage_note: "Spoken upon crossing a point of no return; Latin: Alea iacta est."
    source_language: "la"
    register: "formal"
    example: "Once the resignation letter was delivered to the board, the die was cast."

  - phrase: "I came, I saw, I conquered"
    attribution: "Julius Caesar (Plutarch, Life of Caesar)"
    meaning: "A swift, overwhelming, and comprehensive victory achieved without hesitation."
    usage_note: "Triumphant boast of rapid decisive success; Latin: Veni, vidi, vici."
    source_language: "la"
    register: "everyday"
    example: "The debate team arrived, swept the tournament, and left: they came, they saw, they conquered."

  - phrase: "Beware the ides of March"
    attribution: "William Shakespeare (Julius Caesar, Act I, Scene 2)"
    meaning: "A warning of impending betrayal or disaster, traditionally associated with March 15th."
    usage_note: "Ominous forewarning of treachery or downfall."
    register: "literary"
    example: "Before the hostile shareholder vote, the chief executive was told to beware the ides of March."

  - phrase: "The fault, dear Brutus, is not in our stars, but in ourselves"
    attribution: "William Shakespeare (Julius Caesar, Act I, Scene 2)"
    meaning: "Our misfortunes and subservience are caused by our own weakness, not by fate."
    usage_note: "Moral challenge demanding personal agency and rejecting fatalism."
    register: "literary"
    example: "Blaming market conditions is lazy; the fault, dear Brutus, is not in our stars, but in ourselves."

  - phrase: "Cowards die many times before their deaths"
    attribution: "William Shakespeare (Julius Caesar, Act II, Scene 2)"
    meaning: "Fearing death or failure inflicts repeated psychological agony, whereas the brave face reality once."
    usage_note: "Exhortation to face fearful challenges with courage."
    register: "literary"
    example: "She refused to dread the public inquiry, recalling that cowards die many times before their deaths."

  - phrase: "All the world's a stage"
    attribution: "William Shakespeare (As You Like It, Act II, Scene 7)"
    meaning: "Human life is an ongoing theatrical drama in which individuals merely play assigned roles."
    usage_note: "Philosophical observation on social roles and life's inevitable stages."
    register: "literary"
    example: "Watching politicians pivot on television, one remembers Shakespeare's line that all the world's a stage."

  - phrase: "The lady doth protest too much, methinks"
    attribution: "William Shakespeare (Hamlet, Act III, Scene 2)"
    meaning: "Excessive or exaggerated denial suggests that the speaker is actually guilty or insincere."
    usage_note: "Skeptical remark when someone denies an accusation with suspicious vehemence."
    register: "everyday"
    example: "He insisted five times that he bore no grudge, leading colleagues to think the gentleman protested too much."

  - phrase: "Something is rotten in the state of Denmark"
    attribution: "William Shakespeare (Hamlet, Act I, Scene 4)"
    meaning: "There is hidden corruption, wrongdoing, or decay within an institution or hierarchy."
    usage_note: "Intuitive warning of institutional malpractice or ethical breakdown."
    register: "formal"
    example: "When three senior auditors resigned in a week, we knew something was rotten in the state of Denmark."

  - phrase: "Parting is such sweet sorrow"
    attribution: "William Shakespeare (Romeo and Juliet, Act II, Scene 2)"
    meaning: "The sadness of saying goodbye is tempered by the intense tenderness of mutual affection."
    usage_note: "Sentimental expression used at tender departures."
    register: "literary"
    example: "As the train doors closed, they smiled through tears: parting was indeed sweet sorrow."

  - phrase: "What's in a name? That which we call a rose by any other name would smell as sweet"
    attribution: "William Shakespeare (Romeo and Juliet, Act II, Scene 2)"
    meaning: "Labels and titles are arbitrary; intrinsic nature and qualities matter far more."
    usage_note: "Argument that rebranding or renaming cannot alter underlying reality."
    register: "literary"
    example: "The firm rebranded its subprime product, but what's in a name? The risk smelled just as pungent."

  - phrase: "Never in the field of human conflict was so much owed by so many to so few"
    attribution: "Winston Churchill (Speech to Parliament, August 20, 1940)"
    meaning: "An expression of profound national gratitude to the small group of RAF pilots in the Battle of Britain."
    usage_note: "High tribute to a small team defending a larger collective against overwhelming odds."
    register: "formal"
    example: "In his historic tribute to the fighter pilots, Churchill declared that never was so much owed by so many to so few."

  - phrase: "History will be kind to me, for I intend to write it"
    attribution: "Winston Churchill (Speech in the House of Commons, 1948)"
    meaning: "Those who document and publish historical accounts have the power to shape their own legacy."
    usage_note: "Audacious, candid acknowledgment of the narrative power of historiography."
    register: "formal"
    example: "He began drafting his political memoirs immediately, confident that history would be kind because he intended to write it."

  - phrase: "The arc of the moral universe is long, but it bends toward justice"
    attribution: "Theodore Parker (1853 sermon; popularized by Martin Luther King Jr.)"
    meaning: "Social progress and moral fairness require immense time and struggle, but eventually prevail."
    usage_note: "Inspiring moral consolation during protracted political campaigns."
    register: "formal"
    example: "King comforted civil rights marchers with the conviction that the moral arc of the universe bends toward justice."

  - phrase: "If you want peace, prepare for war"
    attribution: "Vegetius (De Re Militari, c. 390)"
    meaning: "Maintaining credible military deterrent strength is the most reliable way to prevent invasion."
    usage_note: "Realist doctrine of national defense; Latin: Si vis pacem, para bellum."
    source_language: "la"
    register: "formal"
    example: "The defense minister justified the navy budget with Vegetius's ancient rule: if you want peace, prepare for war."

  - phrase: "An eye for an eye will only make the whole world blind"
    attribution: "Attributed to Mahatma Gandhi (apocryphal; first recorded by Louis Fischer, 1947)"
    meaning: "Retaliatory vengeance creates an escalating cycle of violence that ultimately ruins everyone."
    usage_note: "Ethical appeal for forgiveness, pacification, and reconciliation."
    register: "everyday"
    example: "Begging the factions to cease revenge attacks, the mediator warned that an eye for an eye leaves the whole world blind."

  - phrase: "Simplicity is the ultimate sophistication"
    attribution: "Attributed to Leonardo da Vinci (apocryphal; 20th-century design motto)"
    meaning: "Refining an idea to its cleanest, most unadorned essence demonstrates the highest mastery."
    usage_note: "Commonly cited principle in modern software design and industrial engineering."
    register: "everyday"
    example: "The new operating system stripped away clutter, proving that simplicity is the ultimate sophistication."

  - phrase: "You must be the change you wish to see in the world"
    attribution: "Attributed to Mahatma Gandhi (apocryphal paraphrase of his 1913 article)"
    meaning: "Personal reform and ethical living must precede and inspire wider societal change."
    usage_note: "Call for personal accountability rather than waiting for systemic reform."
    register: "everyday"
    example: "Instead of complaining about community litter, she organized a cleanup, acting on the maxim to be the change."

borrowed_phrases:
  - phrase: "schadenfreude"
    source_language: "de"
    register: "everyday"
    meaning: "Malicious pleasure or gratification derived from another person's misfortune or trouble."
    example: "There was a palpable sense of schadenfreude in the office when the arrogant director lost his contract."
    origin: "German Schaden ('harm') + Freude ('joy')."

  - phrase: "zeitgeist"
    source_language: "de"
    register: "everyday"
    meaning: "The defining spirit, intellectual outlook, and moral mood of a particular period of history."
    example: "His debut novel captured the anxious zeitgeist of the early twenty-first century."
    origin: "German Zeit ('time') + Geist ('spirit')."

  - phrase: "doppelgänger"
    source_language: "de"
    register: "everyday"
    meaning: "An uncanny apparition or exact physical double of a living person."
    example: "At the airport I saw a man who looked so identical to my brother he could have been his doppelgänger."
    origin: "German Doppelgänger, from doppelt ('double') + Gänger ('goer')."

  - phrase: "wanderlust"
    source_language: "de"
    register: "everyday"
    meaning: "A strong, innate, and restless impulse or desire to travel and explore the world."
    example: "After three years confined to a desk job, his old wanderlust returned with irresistible force."
    origin: "German wandern ('to hike, wander') + Lust ('desire')."

  - phrase: "kaput"
    source_language: "de"
    register: "informal"
    meaning: "Completely broken, ruined, useless, or dead."
    example: "The washing machine made a horrible clattering noise and is now totally kaput."
    origin: "German kaputt, originally from French capot ('not having won a single trick in cards')."

  - phrase: "realpolitik"
    source_language: "de"
    register: "formal"
    meaning: "Diplomacy and politics based on pragmatic self-interest and power rather than moral or ideological ethics."
    example: "The treaty was hailed as a triumph of cold realpolitik over sentimental alliances."
    origin: "German Realpolitik, from real ('practical, real') + Politik ('politics')."

  - phrase: "verboten"
    source_language: "de"
    register: "literary"
    meaning: "Strictly forbidden or prohibited by law, authority, or strict convention."
    example: "Smoking in the courtyard was strictly verboten under the headmaster's stern regime."
    origin: "German verboten ('forbidden')."

  - phrase: "angst"
    source_language: "de"
    register: "everyday"
    meaning: "A deep, persistent feeling of generalized anxiety, existential dread, or apprehension."
    example: "Adolescent angst permeated every lyric on the band's breakthrough album."
    origin: "German Angst ('fear, anxiety')."

  - phrase: "faux pas"
    source_language: "fr"
    register: "everyday"
