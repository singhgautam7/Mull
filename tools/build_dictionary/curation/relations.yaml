# Curated word relations: synonyms, antonyms, and word family overrides.
# These enrich and complement WordNet and Kaikki extractions for learning set words.

cognitive:
  synonyms:
    - mental
    - intellectual
    - cerebral
    - rational
  antonyms:
    - emotional
    - physical
    - intuitive
  family:
    - word: cognition
      pos: noun
    - word: cognitively
      pos: adverb
    - word: cognizant
      pos: adjective
    - word: cognise
      pos: verb

