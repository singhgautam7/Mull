# Hand-written holdout for tuning the stage B filter. `belongs` are words that
# should be in the learning pool; `does_not` are words that should not: either
# known by everyone, or too obscure, archaic, slangy or not a word at all.
# The build report prints precision and recall against this file. If the
# filter rejects "adamant" or accepts "noodles", the thresholds are wrong.

