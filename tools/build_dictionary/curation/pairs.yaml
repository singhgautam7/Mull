# "Almost the Same": pairs people mix up. Hand-written; the pipeline copies
# these into the `pairs` table and a collection of kind `pairs`. The app hides
# that kind until Design ships a two-word card, so nothing here is shown yet.
#
# note: one sentence that separates the two. Both words must resolve in the
# lookup dictionary or the build warns and skips the pair.

title: Almost the Same
description: Pairs that are not interchangeable, and why.

pairs:
  - [continual, continuous, "Continual stops and starts; continuous never stops."]
  - [imply, infer, "The speaker implies; the listener infers."]
  - [uninterested, disinterested, "Uninterested is bored; disinterested is impartial."]
  - [affect, effect, "Affect is usually the verb; effect is usually the noun."]
  - [compliment, complement, "A compliment is praise; a complement completes something."]
  - [discreet, discrete, "Discreet is tactful; discrete is separate."]
  - [principal, principle, "The principal is the main one; a principle is a rule."]
  - [stationary, stationery, "Stationary is not moving; stationery is paper and envelopes."]
  - [practice, practise, "In British English practice is the noun and practise the verb."]
  - [licence, license, "In British English licence is the noun and license the verb."]
  - [advice, advise, "Advice is the noun; advise is the verb."]
  - [ensure, insure, "Ensure makes certain; insure buys cover against loss."]
  - [assure, ensure, "You assure a person; you ensure an outcome."]
  - [eminent, imminent, "Eminent is distinguished; imminent is about to happen."]
  - [flaunt, flout, "You flaunt what you have and flout the rules."]
  - [historic, historical, "Historic is important in history; historical is merely from the past."]
  - [economic, economical, "Economic concerns the economy; economical is thrifty."]
  - [classic, classical, "Classic is of the highest quality; classical belongs to a tradition."]
  - [alternate, alternative, "Alternate takes turns; an alternative is another option."]
  - [averse, adverse, "A person is averse to something; conditions are adverse."]
  - [allude, elude, "You allude to something indirectly; something eludes your grasp."]
  - [illusion, allusion, "An illusion deceives; an allusion refers."]
  - [appraise, apprise, "You appraise a value; you apprise someone of a fact."]
  - [ambiguous, ambivalent, "A statement is ambiguous; a person is ambivalent."]
  - [amoral, immoral, "Amoral has no moral sense; immoral breaks one."]
  - [censor, censure, "To censor is to cut; to censure is to condemn."]
  - [climactic, climatic, "Climactic is of a climax; climatic is of the climate."]
  - [council, counsel, "A council is a body; counsel is advice or a lawyer."]
  - [defuse, diffuse, "You defuse a bomb or a row; light diffuses."]
  - [dependant, dependent, "In British English a dependant is a person; dependent is the adjective."]
  - [elicit, illicit, "To elicit is to draw out; illicit is unlawful."]
  - [enormity, enormousness, "Enormity is great wickedness; enormousness is great size."]
  - [envy, jealousy, "Envy wants what another has; jealousy guards what one has."]
  - [exhaustive, exhausting, "Exhaustive is thorough; exhausting is tiring."]
  - [farther, further, "Farther is distance; further is degree, and also distance."]
  - [fewer, less, "Fewer counts things; less measures amounts."]
  - [flammable, inflammable, "They mean the same; inflammable is the older word."]
  - [fortunate, fortuitous, "Fortunate is lucky; fortuitous is by chance."]
  - [hoard, horde, "A hoard is a stash; a horde is a crowd."]
  - [imply, insinuate, "To imply is to suggest; to insinuate is to suggest something nasty."]
  - [ingenious, ingenuous, "Ingenious is clever; ingenuous is innocent."]
  - [judicial, judicious, "Judicial belongs to courts; judicious shows good judgement."]
  - [lay, lie, "You lay something down; you lie down yourself."]
  - [loath, loathe, "Loath is reluctant; to loathe is to hate."]
  - [luxuriant, luxurious, "Luxuriant grows thickly; luxurious is expensive comfort."]
  - [militate, mitigate, "Facts militate against a plan; measures mitigate a harm."]
  - [nauseous, nauseated, "Strictly, nauseous causes sickness and nauseated feels it."]
  - [notable, notorious, "Notable is worth noting; notorious is known for something bad."]
  - [official, officious, "Official has authority; officious is bossily interfering."]
  - [peruse, skim, "To peruse is to read carefully, not to skim."]
  - [prescribe, proscribe, "To prescribe is to order; to proscribe is to forbid."]
  - [regretful, regrettable, "A person is regretful; an event is regrettable."]
  - [reluctant, reticent, "Reluctant is unwilling to act; reticent is unwilling to speak."]
  - [sensual, sensuous, "Sensual is bodily pleasure; sensuous is pleasing to the senses."]
  - [simple, simplistic, "Simple is uncomplicated; simplistic is too simple to be right."]
  - [tortuous, torturous, "Tortuous is winding; torturous is painful."]
  - [uninterested, indifferent, "Uninterested has no interest; indifferent does not care either way."]
  - [venal, venial, "Venal is corruptible; venial is forgivable."]
  - [wreak, wreck, "You wreak havoc; you wreck a car."]
  - [precede, proceed, "To precede is to come before; to proceed is to go on."]
  - [empathy, sympathy, "Empathy feels with someone; sympathy feels for them."]
